name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: infergate
          POSTGRES_PASSWORD: infergate
          POSTGRES_DB: infergate
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U infergate"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: DATABASE_URL=postgres://infergate:infergate@localhost:5433/infergate bun run packages/db/src/migrate.ts
      - run: bun test
        env:
          TEST_DATABASE_URL: postgres://infergate:infergate@localhost:5433/infergate
          TEST_REDIS_URL: redis://localhost:6379

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - working-directory: apps/web
        run: ../../node_modules/.bin/next build
