apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: infergate-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: infergate-gateway
  template:
    metadata:
      labels:
        app: infergate-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: pepper
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: redis-url
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.env.rateLimitPerMinute | quote }}
            - name: RATE_LIMIT_FAIL_OPEN
              value: {{ .Values.env.rateLimitFailOpen | quote }}
            - name: DEFAULT_STRATEGY
              value: {{ .Values.env.defaultStrategy | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.env.allowedOrigins | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
